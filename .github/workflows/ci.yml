name: CI

# No `paths` filter, deliberately. Scoping at the trigger means a PR that
# matches nothing runs no jobs, and a required check that never reports blocks
# the merge forever.
#
# workflow_dispatch: the release workflow opens its PR with GITHUB_TOKEN, which triggers no
# pull_request run, so it dispatches this workflow on the release branch to report the checks.
#
# `manifests • skills` is the one required check. It runs after every other job and fails unless
# each passed, so every gate here blocks the merge, the release PR's auto-merge included.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: a retitle re-runs the title gate
  workflow_dispatch:

# Cancel superseded PR runs only: a cancelled main run leaves that push's commits unscanned,
# because the next push's secret scan covers only its own commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: manifests • skills
    needs: [title, shellcheck, gitleaks, suites]
    # A failed or skipped need would skip this job, and a skipped required check counts as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Every manifest is valid JSON
        # The floor assertion is load-bearing. `< <(find ...)` does not surface
        # find's exit code, so if these directories ever move, the loop body runs
        # zero times and the step reports green having validated nothing.
        run: |
          set -euo pipefail
          fail=0; n=0
          while IFS= read -r f; do
            n=$((n + 1))
            if python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "  ok    $f"
            else
              echo "::error file=$f::invalid JSON"; fail=1
            fi
          done < <(find .claude-plugin plugins -name '*.json' | sort)
          # Assert the invariant directly. A count floor is not enough: moving
          # .claude-plugin/ away still leaves one manifest per plugin, which clears
          # any count derived from the plugin directories.
          if [ ! -f .claude-plugin/marketplace.json ]; then
            echo "::error::.claude-plugin/marketplace.json is missing — did the layout move?"
            fail=1
          fi
          expected=$(( 1 + $(find plugins -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l) ))
          if [ "$n" -lt "$expected" ]; then
            echo "::error::expected at least $expected manifests, found $n — did the layout move?"
            fail=1
          fi
          echo "validated $n manifests"
          exit $fail

      - name: Marketplace and plugin manifests agree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, sys
          fail = []
          mk = json.load(open('.claude-plugin/marketplace.json'))
          entries = mk['plugins']

          names = [p['name'] for p in entries]
          dupes = sorted({n for n in names if names.count(n) > 1})
          if dupes:
              fail.append(('.claude-plugin/marketplace.json', f"duplicate plugin names: {dupes}"))

          sources = set()
          for entry in entries:
              src = pathlib.Path(entry['source'])
              sources.add(src.resolve())
              if not src.is_dir():
                  fail.append(('.claude-plugin/marketplace.json',
                               f"source does not exist: {entry['name']} -> {src}"))
                  continue
              man = src / '.claude-plugin' / 'plugin.json'
              if not man.is_file():
                  fail.append((str(src), f"no plugin.json for {entry['name']}"))
                  continue
              got = json.load(open(man)).get('name')
              if got != entry['name']:
                  fail.append((str(man),
                               f"name mismatch: marketplace says {entry['name']}, manifest says {got}"))

          # Reverse: compare on the SOURCE PATH, not the directory basename, so the
          # error cannot claim a listed directory is unlisted.
          for d in sorted(pathlib.Path('plugins').iterdir()):
              if d.is_dir() and d.resolve() not in sources:
                  fail.append((str(d), "no marketplace.json entry sources this directory"))

          for path, msg in fail:
              print(f"::error file={path}::{msg}")
          print(f"checked {len(entries)} plugins")
          sys.exit(1 if fail else 0)
          PY

      - name: Manifests and skill/agent frontmatter validate
        run: |
          set -euo pipefail
          bash scripts/ci/test/run-validate-manifests-tests.sh
          node scripts/ci/validate-manifests.js

      - name: Branches carry no version edits; plugin changes carry a changelog fragment
        # Every PR and dispatched branch except this repo's release/next, the one branch that stamps.
        if: >-
          (github.event_name == 'pull_request'
            && !(github.head_ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository))
          || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/release/next')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/check-pr.sh "$BASE_SHA" "$HEAD_SHA"

      - name: issue-manager CLI tests
        # Run in-process, not --test: under --test an empty file counts as one passing test.
        run: |
          set -euo pipefail
          rc=0
          out=$(node --test-reporter=tap plugins/issue-manager/skills/issue-manager/scripts/gh-issues.test.js) || rc=$?
          printf '%s\n' "$out"
          [ "$rc" -eq 0 ] || exit "$rc"
          pass=$(printf '%s\n' "$out" | awk '/^# pass /{print $3}')
          if [ "${pass:-0}" -lt 1 ]; then
            echo "::error::issue-manager CLI tests ran zero tests"
            exit 1
          fi

      - name: No skill hardcodes the marketplace identifier as a lookup key
        # Regression guard. Resolving a script via `<plugin>@<marketplace>` orphans
        # the lookup on any marketplace rename, silently. Match on the plugin name.
        run: |
          set -euo pipefail

          # Follow renames: catch the historical name family AND whatever the
          # manifest currently declares, so this does not go blind after the next one.
          current=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['name'])")
          case "$current" in
            *[!A-Za-z0-9._-]*) echo "::error::marketplace name is not a plain slug: $current"; exit 1 ;;
          esac

          # Assert the scan target exists rather than inferring it from grep's exit
          # code, which differs between GNU (2) and BSD (1) on a missing directory.
          if [ ! -d plugins ]; then
            echo "::error::plugins/ not found — the guard did not run"
            exit 1
          fi

          # Capture grep's OWN status too. Piping into `grep -v` masks a hard error
          # (exit 2) as a no-match (exit 1), which reads as clean.
          rc=0
          raw=$(grep -rnE "@(lafollett[a-z-]*-claude-plugins|${current})" plugins \
                  --include='*.md' --include='*.js' --include='*.py' \
                  --include='*.sh' --include='*.json' --include='*.yml') || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::grep failed with exit $rc — the guard did not run"
            exit 1
          fi

          # Strip `file:line:` before anchoring, or the comment exemption is a no-op:
          # every grep -n line starts with a path, never with whitespace-then-#.
          hits=$(printf '%s' "$raw" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)

          if [ -n "$hits" ]; then
            echo "$hits" | while IFS= read -r h; do
              echo "::error file=${h%%:*}::hardcoded marketplace key: $h"
            done
            exit 1
          fi
          echo "no hardcoded marketplace keys"

      - name: Every other gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECT: 4
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: bash scripts/ci/gate-needs.sh

  title:
    name: conventional title
    # scripts/ci/check-title.sh: the squash commit sets the release level, so the title (and a
    # one-commit PR's commit) must be a conventional commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Title (and a lone commit's message) is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          COMMITS: ${{ github.event.pull_request.commits }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: bash scripts/ci/check-title.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Lint every tracked shell script
        # *.sh plus extensionless files with a sh/bash shebang (git hooks). Fail if none are found:
        # zero files would read as clean.
        run: |
          set -euo pipefail
          shellcheck --version | head -n 2
          files=()
          while IFS= read -r -d '' f; do
            case "$f" in
              *.sh) files+=("$f") ;;
              *.*) ;;
              *) head -n 1 "$f" | grep -qE '^#!.*[/ ](ba)?sh([[:space:]]|$)' && files+=("$f") ;;
            esac
          done < <(git ls-files -z)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no shell scripts found"; exit 1; }
          printf '  %s\n' "${files[@]}"
          shellcheck "${files[@]}"

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: bash scripts/ci/security/install-gitleaks.sh

      - name: Scan the commits this run brings in
        # PR: its commits. Push: the pushed commits. Dispatch: the whole tree.
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/security/secret-scan.sh

  suites:
    name: test suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install gitleaks (the secret-scan suite runs the real binary)
        run: bash scripts/ci/security/install-gitleaks.sh

      - name: Every scripts/ci and plugin bin/test suite
        run: bash scripts/ci/run-shell-tests.sh

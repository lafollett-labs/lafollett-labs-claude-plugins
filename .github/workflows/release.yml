name: Release

# After each merge to main: tag any merged release PR, then stamp the versions for the commits
# since the newest tag onto the release/next PR and auto-merge it. All logic lives in
# scripts/ci/release/ (version-stamp.js decides, run-release.sh does the git and gh I/O).
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests",
# and Settings → General → "Allow auto-merge".
# A release PR the run's wait misses is merged as github-actions[bot], which triggers no workflow,
# so its tag lands on the next run; dispatch this workflow to tag it sooner.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: stamp • tag
    if: github.repository == 'lafollett-labs/lafollett-labs-claude-plugins'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write        # push release/next, create tags
      pull-requests: write   # open, edit and auto-merge the release PR
      actions: write         # dispatch ci.yml on release/next
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Prove the engine before it writes anything
        run: bash scripts/ci/release/test/run-release-unit-tests.sh

      - name: Tag merged releases; stamp and open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/release/run-release.sh

name: PR title

# The squash commit's subject sets the release level, so it must be a conventional commit.
# GitHub squashes a single-commit PR under that commit's subject, so it is checked too.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Title (and a lone commit's subject) is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -uo pipefail
          engine=scripts/ci/release/version-stamp.js
          rc=0
          if ! node "$engine" subject-check --subject "$TITLE"; then
            echo "::error::PR title is not a conventional commit (type(scope)!: description): $TITLE"
            rc=1
          fi
          if [ "$COMMITS" = 1 ]; then
            subject="$(git log -1 --format=%s HEAD)"
            if ! node "$engine" subject-check --subject "$subject"; then
              echo "::error::the PR's only commit becomes the squash subject and is not a conventional commit: $subject"
              rc=1
            fi
          fi
          [ "$rc" -eq 0 ] && echo "release level: $(node "$engine" level --subject "$TITLE")"
          exit "$rc"

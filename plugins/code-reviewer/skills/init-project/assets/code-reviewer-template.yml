# .code-reviewer.yml — Generated by /init-project
# Project-level configuration for the /code-reviewer skill.
#
# The code-reviewer skill reads this file to determine which PE references
# to load and which test commands to run for each part of the codebase.
#
# Regenerate with: /init-project

version: "1.0"

# Project metadata
project:
  name: "{PROJECT_NAME}"
  generated_at: "{YYYY-MM-DD}"

# Stack Map — maps directory paths to stacks and PE types.
# The code-reviewer skill uses this to route diff files to the right PE.
stacks:
  # - paths: glob patterns for directories/files belonging to this stack
  #   stack: human-readable stack name
  #   pe: built-in PE — stack: pe-go | pe-vue | pe-rust | pe-aws-infra | pe-governance | pe-devtools
  #                       domain: pe-audio (overlaps stack entries; dispatched beside the stack PE)
  #   test_commands: commands to run during Quality pass ([] for domain PEs)
  #
  # Examples:
  # - paths: ["lambdas/**", "pkg/**", "cmd/**"]
  #   stack: Go
  #   pe: pe-go
  #   test_commands:
  #     - "go vet ./..."
  #     - "go test ./... -count=1 -race"
  #
  # - paths: ["engine/**"]
  #   stack: Rust (Cargo workspace, wasm32)
  #   pe: pe-rust
  #   test_commands:
  #     - "cd engine && cargo fmt --all --check"
  #     - "cd engine && cargo clippy --workspace --all-targets -- -D warnings"
  #     - "cd engine && cargo test --workspace"
  #     - "cd engine && cargo build -p engine-wasm --target wasm32-unknown-unknown --release"
  #
  # - paths: ["web/**"]
  #   stack: Vue 3 + Vite (PWA)
  #   pe: pe-vue
  #   test_commands:
  #     - "cd web && npm run typecheck && npm test && npm run build"
  #
  # - paths: ["engine/crates/dsp/**", "web/src/audio/**", "fixtures/audio/**"]
  #   stack: Real-time audio / DSP (domain)
  #   pe: pe-audio
  #   test_commands: []

  - paths: ["{PATHS}"]
    stack: "{STACK}"
    pe: "{PE_TYPE}"
    test_commands:
      - "{TEST_CMD}"

# Review settings
settings:
  # Lines changed threshold for sub-agent dispatch
  sub_agent_threshold: 200

  # Output directory for review documents
  output_dir: "docs/code-reviews"

  # Max concurrent suite-running PEs (pe-go, pe-vue, pe-rust, pe-aws-infra); default 2
  max_parallel_pes: 2

  # Verdict strictness
  # strict: MEDIUM and above block merge (default)
  # standard: only CRITICAL/HIGH block merge
  verdict_mode: "strict"

  # Commit review document to branch automatically
  auto_commit: true

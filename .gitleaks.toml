# gitleaks config for the CI secret scan: default rules plus an explicit allow-list.
#
# Each [[allowlists]] entry clears ONE known-safe value in ONE file:
#   description  why the value is safe (required)
#   condition    "AND" — the path AND the value must both match
#   paths        exactly one file, anchored (no directory globs)
#   regexes      ONE pattern on one line: ^, then 8+ literal characters (escape punctuation as \.),
#                then an optional $; the exact line (regexTarget = "line") or value (regexTarget = "secret")
# scripts/ci/security/secret-scan.sh refuses any other shape: a .gitleaksignore file, stopwords, an
# allow-list outside a top-level [[allowlists]] table (legacy, per-rule, dotted key or inline),
# disabledRules, and any [extend] key but useDefault = true.
# Inline gitleaks:allow comments are ignored.

[extend]
useDefault = true

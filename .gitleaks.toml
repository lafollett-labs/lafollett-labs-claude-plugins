# gitleaks config for the CI secret scan: default rules plus an explicit allow-list.
#
# Each [[allowlists]] entry clears ONE known-safe value in ONE file:
#   description  why the value is safe (required)
#   condition    "AND" — the path AND the value must both match
#   paths        exactly one file, anchored (no directory globs)
#   regexes      the exact line (regexTarget = "line") or anchored detected value (regexTarget = "secret")
# scripts/ci/security/secret-scan.sh refuses any other shape, a .gitleaksignore file, a legacy
# [allowlist] table, per-rule allow-lists and disabledRules; inline gitleaks:allow comments are ignored.

[extend]
useDefault = true
